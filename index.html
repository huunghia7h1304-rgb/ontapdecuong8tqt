<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập Đề Cương Giữa Kỳ I - Lớp 8</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            100: '#e0ebff',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }

    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-none">Đề Cương Ôn Tập Lớp 8</h1>
                    <p class="text-xs text-slate-400 mt-1">Học Kỳ I - Trường THCS Trương Quang Trọng</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs px-3 py-1 bg-slate-800 text-slate-300 rounded-full border border-slate-700 hidden sm:inline-block">
                    <i class="fa-solid fa-book-open text-blue-400 mr-1"></i> Tổng hợp Đề Cương
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">
        
        <!-- Sidebar Filter & List -->
        <aside class="w-full md:w-80 flex-shrink-0 flex flex-col gap-4">
            
            <!-- Search & Filter Controls -->
            <div class="glass p-4 rounded-xl space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderDocumentList()" placeholder="Tìm kiếm nội dung..." 
                           class="w-full pl-9 pr-4 py-2 bg-slate-900/80 border border-slate-700/60 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
                </div>
                <div class="flex flex-wrap gap-1.5" id="subjectFilter">
                    <!-- Dynamic Filter Buttons -->
                </div>
            </div>

            <!-- Documents List -->
            <div class="glass p-3 rounded-xl flex-1 flex flex-col gap-2 max-h-[calc(100vh-280px)] overflow-y-auto" id="docListContainer">
                <!-- Dynamic Document Items -->
            </div>
        </aside>

        <!-- Main Viewer Section -->
        <section class="flex-1 flex flex-col glass rounded-xl overflow-hidden min-h-[600px]">
            <!-- Active Doc Header -->
            <div class="p-4 bg-slate-900/60 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4" id="viewerHeader">
                <!-- Dynamic Header Info -->
            </div>

            <!-- Active Doc Content -->
            <div class="flex-1 p-6 overflow-y-auto bg-slate-950/40 text-slate-200 leading-relaxed text-sm sm:text-base space-y-4" id="viewerContent">
                <!-- Dynamic Content -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
        Hệ thống ôn tập học tập trực tuyến • Được phát triển cho học sinh Lớp 8
    </footer>

                    <div class="space-y-4">
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-slate-100 mb-2">Câu 1:</h3>

                                <li><strong>Tính chất ẩm và gió mùa:</strong> Tiếp giáp Biển Đông rộng lớn kết hợp gió mùa mang lại lượng mưa lớn, độ ẩm không khí cao[cite: 1].</li>
                                <li><strong>Giải thích:</strong> Nhờ tiếp giáp Biển Đông và trong khu vực gió mùa Châu Á, các khối khí đi qua biển được tăng cường độ ẩm, làm dịu tính chất khô nóng đặc trưng[cite: 1].</li>

                    </div>

            },
            {
                id: "dia-ly-8-main",
                title: "ĐỊA LÝ 8 - Giữa Kỳ I",
                filename: "ĐỊA LÝ 81.docx",
                subject: "Địa Lí",
                badgeColor: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
                author: "Trường THCS Trương Quang Trọng",
                content: `
                    <h2 class="text-xl font-bold text-emerald-400 border-b border-slate-800 pb-2 mb-4">NỘI DUNG ÔN TẬP KIỂM TRA GIỮA KÌ I - ĐỊA LÍ 8</h2>
                    <p class="text-xs text-slate-400 mb-4">Năm học 2026 - 2027 • Trường THCS Trương Quang Trọng[cite: 2]</p>

                            <p class="text-slate-300">Nước ta nằm ở vị trí nội chí tuyến bán cầu Bắc; trong khu vực châu Á gió mùa; nơi tiếp giáp giữa đất liền và đại dương[cite: 2].</p>

            },
            {

                    <div class="space-y-4">

                            <p class="text-slate-300 mb-1"><strong>Cấu tạo:</strong> Gồm bộ xương (~206 xương) và hệ cơ (~600 cơ)[cite: 3].</p>
                            <p class="text-slate-300"><strong>Chức năng:</strong> Định hình cơ thể, bảo vệ nội quan, giúp cơ thể cử động và di chuyển[cite: 3].</p>
                        </div>
                    </div>
                `
            },
            {
                id: "gdcd-8",
                title: "GDCD 8 - Soạn GK I",
                filename: "Soạn GDCD GHKI.docx",
                subject: "GDCD",
                badgeColor: "bg-amber-500/10 text-amber-400 border-amber-500/20",
                author: "Tự luận GK1",
                content: `
                    <h2 class="text-xl font-bold text-amber-400 border-b border-slate-800 pb-2 mb-4">SOẠN GDCD 8 - GIỮA KỲ I[cite: 4]</h2>
                    <div class="space-y-4">
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-amber-300 mb-1">Bài 1: Tự Hào Về Truyền Thống Dân Tộc Việt Nam[cite: 4]</h3>
                            <p class="text-slate-300"><strong>Truyền thống tiêu biểu:</strong> Yêu nước, đoàn kết, nhân nghĩa, cần cù lao động, hiếu học, tôn sư trọng đạo...[cite: 4]</p>
                        </div>
                    </div>
                `
            },
            {
                id: "lich-su-8",
                title: "LỊCH SỬ 8 - Soạn GK I",
                filename: "SOẠN LỊCH SỬ 8 GIỮA KÌ 1.docx",
                subject: "Lịch Sử",
                badgeColor: "bg-purple-500/10 text-purple-400 border-purple-500/20",
                author: "Tự luận Lịch Sử 8",
                content: `
                    <h2 class="text-xl font-bold text-purple-400 border-b border-slate-800 pb-2 mb-4">SOẠN LỊCH SỬ 8 - GIỮA KÌ 1[cite: 5]</h2>
                    <div class="space-y-4">
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-purple-300 mb-2">Câu 1: Thành tựu tiêu biểu Cách mạng công nghiệp[cite: 5]</h3>
                            <p class="text-slate-300"><strong>Anh:</strong> Máy kéo sợi Gien-ni (1764), máy hơi nước Giêm-oát (1784)...[cite: 5]</p>
                        </div>
                    </div>
                `
            },
            {
                id: "tin-hoc-8-nghia",
                title: "Tin học 8 (Nghĩa soạn)",
                filename: "SOẠN TỰ LUẬN TIN.docx",
                subject: "Tin Học",
                badgeColor: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20",
                author: "Nghĩa soạn",
                content: `
                    <h2 class="text-xl font-bold text-cyan-400 border-b border-slate-800 pb-2 mb-4">SOẠN ĐỀ CƯƠNG TIN HỌC 8 - GIỮA KỲ I (Bản của Nghĩa)</h2>
                    <p class="text-xs text-slate-400 mb-4">Nguồn file: SOẠN TỰ LUẬN TIN.docx[cite: 6] • Tác giả: Nghĩa soạn</p>
                    <div class="space-y-4">
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-cyan-300 mb-2">Câu 1: Trình bày các đặc điểm chính của thông tin số[cite: 6]</h3>
                            <ul class="list-disc pl-5 space-y-1 text-slate-300">
                                <li>Thông tin số dễ dàng được nhân bản và lan truyền nhưng khó bị xóa bỏ hoàn toàn[cite: 6].</li>
                                <li>Thông tin số có thể được truy cập từ xa nếu người quản lí thông tin đó cho phép[cite: 6].</li>
                            </ul>
                        </div>
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-cyan-300 mb-2">Câu 3: Đánh giá phiến diện & Đăng ảnh người khác[cite: 6]</h3>
                            <p class="text-slate-300"><strong>Ứng xử đăng ảnh:</strong> Xin phép người đó trước khi đăng lên mạng xã hội, chọn hình ảnh phù hợp, không gây ảnh hưởng đến danh dự và quyền riêng tư[cite: 6].</p>
                        </div>
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-cyan-300 mb-2">Câu 5: Số hóa dữ liệu thực tế[cite: 6]</h3>
                            <p class="text-slate-300"><strong>Chuyển sách in thành văn bản:</strong> Dùng Word gõ lại, dùng máy quét OCR, hoặc dùng AI (ChatGPT, Gemini) chụp ảnh trích xuất chữ[cite: 6].</p>
                        </div>
                    </div>
                `
            },
            {
                id: "tin-hoc-8-kiet",
                title: "Tin học 8 (Kiệt soạn)",
                filename: "Soạn tin 8 GK1.docx",
                subject: "Tin Học",
                badgeColor: "bg-sky-500/10 text-sky-400 border-sky-500/20",
                author: "Kiệt soạn",
                content: `
                    <h2 class="text-xl font-bold text-sky-400 border-b border-slate-800 pb-2 mb-4">SOẠN ĐỀ CƯƠNG TIN HỌC 8 - GIỮA KỲ I (Bản của Kiệt)</h2>
                    <p class="text-xs text-slate-400 mb-4">Nguồn file: Soạn tin 8 GK1.docx[cite: 9] • Tác giả: Kiệt soạn</p>
                    <div class="space-y-4">
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-sky-300 mb-2">Câu 1: Các đặc điểm chính của thông tin số[cite: 9]</h3>
                            <ul class="list-disc pl-5 space-y-1 text-slate-300">
                                <li><strong>Dễ dàng nhân bản và lan truyền:</strong> Sao chép nhanh chóng với chi phí thấp nhưng rất khó bị xóa bỏ hoàn toàn[cite: 9].</li>
                                <li><strong>Truy cập từ xa:</strong> Người dùng có thể tìm kiếm, sử dụng thông tin từ bất kỳ đâu qua Internet[cite: 9].</li>
                            </ul>
                        </div>
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-sky-300 mb-2">Câu 2: Ví dụ về tin đồn không rõ nguồn gốc[cite: 9]</h3>
                            <p class="text-slate-300">Các bài viết cắt ghép hình ảnh sai sự thật trên Facebook/TikTok về đời tư nghệ sĩ hoặc cá nhân, thu hút bình luận chỉ trích, gây tổn hại nghiêm trọng danh dự[cite: 9].</p>
                        </div>
                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                            <h3 class="font-semibold text-sky-300 mb-2">Câu 6: Ứng dụng công nghệ nâng cao hiệu quả công việc[cite: 9]</h3>
                            <p class="text-slate-300">Thanh toán điện tử (Mã QR/Ví điện tử) giúp giao dịch nhanh chóng; Bản đồ số (Google Maps) giúp tìm đường ngắn nhất, tránh ùn tắc[cite: 9].</p>
                        </div>
                    </div>
                `
            }
        ];

        let activeDocId = "tin-hoc-8-nghia";
        let activeSubjectFilter = "All";

        function getSubjects() {
            const subs = ["All"];
            documents.forEach(d => {
                if (!subs.includes(d.subject)) subs.push(d.subject);
            });
            return subs;
        }

        function renderFilterButtons() {
            const container = document.getElementById("subjectFilter");
            const subs = getSubjects();
            container.innerHTML = subs.map(sub => `
                <button onclick="filterSubject('${sub}')" 
                        class="px-2.5 py-1 text-xs rounded-md transition-colors ${activeSubjectFilter === sub ? 'bg-blue-600 text-white font-medium' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}">
                    ${sub === 'All' ? 'Tất cả' : sub}
                </button>
            `).join('');
        }

        function filterSubject(sub) {
            activeSubjectFilter = sub;
            renderFilterButtons();
            renderDocumentList();
        }

        function renderDocumentList() {
            const container = document.getElementById("docListContainer");
            const search = document.getElementById("searchInput").value.toLowerCase();

            const filtered = documents.filter(doc => {
                const matchSubject = activeSubjectFilter === "All" || doc.subject === activeSubjectFilter;
                const matchSearch = doc.title.toLowerCase().includes(search) || doc.filename.toLowerCase().includes(search);
                return matchSubject && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">Không tìm thấy tài liệu phù hợp</div>`;
                return;
            }

            container.innerHTML = filtered.map(doc => `
                <div onclick="selectDocument('${doc.id}')" 
                     class="glass-card p-3 rounded-lg cursor-pointer ${doc.id === activeDocId ? 'border-blue-500/80 bg-blue-950/20' : ''}">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] px-2 py-0.5 rounded border ${doc.badgeColor}">${doc.subject}</span>
                        <span class="text-[10px] text-slate-500"><i class="fa-regular fa-file-word mr-1"></i>DOCX</span>
                    </div>
                    <h3 class="text-sm font-semibold text-slate-200 line-clamp-1">${doc.title}</h3>
                    <p class="text-xs text-slate-400 mt-1"><i class="fa-regular fa-user text-[10px] mr-1"></i>${doc.author}</p>
                </div>
            `).join('');
        }

        function selectDocument(id) {
            activeDocId = id;
            renderDocumentList();
            renderViewer();
        }

        function renderViewer() {
            const doc = documents.find(d => d.id === activeDocId);
            if (!doc) return;

            document.getElementById("viewerHeader").innerHTML = `
                <div>
                    <span class="text-xs px-2.5 py-1 rounded border ${doc.badgeColor}">${doc.subject}</span>
                    <h2 class="text-lg font-bold text-white mt-1">${doc.title}</h2>
                    <p class="text-xs text-slate-400"><i class="fa-solid fa-paperclip mr-1"></i>File gốc: ${doc.filename} • Soạn bởi: ${doc.author}</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="copyContent()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700 transition-colors flex items-center gap-1.5">
                        <i class="fa-regular fa-copy"></i> Sao chép văn bản
                    </button>
                </div>
            `;

            document.getElementById("viewerContent").innerHTML = doc.content;
        }

        function copyContent() {
            const doc = documents.find(d => d.id === activeDocId);
            if (!doc) return;
            const temp = document.createElement("div");
            temp.innerHTML = doc.content;
            navigator.clipboard.writeText(temp.innerText).then(() => {
                alert("Đã sao chép nội dung đề cương vào bộ nhớ tạm!");
            });
        }

        // Initialize
        renderFilterButtons();
        renderDocumentList();
        renderViewer();
    </script>
</body>
</html>
